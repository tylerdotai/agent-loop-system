[build-system]
requires = ["hatchling>=1.30.1,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-loop-system"
version = "0.2.0"
description = "Durable local multi-agent control plane with bounded runners and explicit policy gates."
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tyler Delano" }]
keywords = ["agents", "automation", "evaluation", "multi-agent", "orchestration", "sqlite"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = [
    "build>=1.5.0,<2",
    "pytest>=9.0.3,<10",
    "ruff>=0.15.16,<0.16",
]

[project.urls]
Homepage = "https://github.com/tylerdotai/agent-loop-system"
Repository = "https://github.com/tylerdotai/agent-loop-system"
Issues = "https://github.com/tylerdotai/agent-loop-system/issues"

[project.scripts]
agent-loop = "agent_loop.cli:main"
agent-loop-control = "agent_loop.control_cli:main"
agent-loop-worker = "agent_loop.worker_cli:main"
agent-autonomy = "agent_loop.autonomy_cli:main"
agent-loop-model-broker = "agent_loop.model_broker_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_loop"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
