[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-loop-system"
version = "0.1.0"
description = "Production-oriented closed-loop agent harness with eval gates and stop conditions."
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Tyler Delano" }]
keywords = ["agents", "automation", "evaluation", "loop", "subprocess"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/tylerdotai/agent-loop-system"
Repository = "https://github.com/tylerdotai/agent-loop-system"
Issues = "https://github.com/tylerdotai/agent-loop-system/issues"

[project.scripts]
agent-loop = "agent_loop.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_loop"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
